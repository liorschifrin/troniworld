{% extends "base.html" %}

{% block title %}Create Post - Troniworld{% endblock %}

{% block content %}
<h2>Create Post</h2>

<form method="POST" action="{{ url_for('new_post') }}">
  <label>
    Title
    <input type="text" name="title" required>
  </label>
  <br>
  <label>
    Author
    <input type="text" name="author" required>
  </label>
  <br>
  <label>
    Content
    <textarea id="content-editor" name="content" rows="6"></textarea>
  </label>
  <br>
  <button type="submit">Create</button>
</form>

<a href="{{ url_for('index') }}">Back</a>
{% endblock %}

{% block extra_scripts %}
{% include "editor.html" %}
{% endblock %}
