<h2>Edit Post</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="post" action="{{ url_for('edit_post', post_id=post.id) }}">
  <label>
    Title
    <input type="text" name="title" value="{{ post.title }}" required>
  </label>
  <br>
  <label>
    Author
    <input type="text" name="author" value="{{ post.author }}" required>
  </label>
  <br>
  <label>
    Content
    <textarea id="content-editor" name="content" rows="6">{{ post.content }}</textarea>
  </label>
  <br>
  <button type="submit">Save</button>
</form>

<script src="https://cdn.ckeditor.com/ckeditor5/40.2.0/classic/ckeditor.js"></script>
<script>
  ClassicEditor.create(document.querySelector('#content-editor'));
</script>

<a href="{{ url_for('post', post_id=post.id) }}">Back</a>
