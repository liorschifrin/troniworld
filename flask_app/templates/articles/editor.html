<script src="https://cdn.ckeditor.com/ckeditor5/40.2.0/classic/ckeditor.js"></script>
<script>
  // The article sanitizer (flask_app/sanitize.py) removes tables and media
  // embeds, so the editor must not offer them, not even through paste.
  var ARTICLE_EDITOR_REMOVED_PLUGINS = ['Table', 'TableToolbar', 'MediaEmbed'];
  var ARTICLE_EDITOR_REMOVED_TOOLBAR_ITEMS = ['insertTable', 'mediaEmbed'];

  function UploadAdapter(loader) {
    this.loader = loader;
  }

  UploadAdapter.prototype.upload = function () {
    return this.loader.file.then(function (file) {
      var data = new FormData();
      data.append('upload', file);

      return fetch('{{ url_for("upload_image") }}', {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF_TOKEN },
        body: data
      }).then(function (response) {
        if (!response.ok) {
          throw new Error('Upload failed');
        }
        return response.json();
      }).then(function (result) {
        return { default: result.url };
      });
    });
  };

  function UploadAdapterPlugin(editor) {
    editor.plugins.get('FileRepository').createUploadAdapter = function (loader) {
      return new UploadAdapter(loader);
    };
  }
  
  // Note: CKEditor initialization is now handled in individual templates
  // to allow for change tracking integration
</script>
