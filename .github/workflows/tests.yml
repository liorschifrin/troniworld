name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Passing regression gates
        run: python -m pytest -m 'not known_failure'
      - name: Explicit known defects (strict expected failures)
        # Exit code 5 means no test is marked known_failure (none are left after T09).
        run: python -m pytest -m known_failure || [ $? -eq 5 ]
