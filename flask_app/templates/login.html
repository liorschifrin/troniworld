<h2>Log in</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="post">
  <label>
    Username
    <input type="text" name="username" required>
  </label>
  <br>
  <label>
    Password
    <input type="password" name="password" required>
  </label>
  <br>
  <button type="submit">Log in</button>
</form>
