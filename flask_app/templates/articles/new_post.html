{% extends "articles/base.html" %}

{% block title %}Create Post - Troniworld{% endblock %}

{% block content %}
<h2>Create Post</h2>

<form id="post-form" method="POST" action="{{ url_for('new_post') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>
    Title
    <input type="text" name="title" required>
  </label>
  <br>
  <label>
    Author
    <input type="text" name="author" required>
  </label>
  <br>
  <label>
    Content
    <textarea id="content-editor" name="content" rows="6"></textarea>
  </label>
  <br>
  <button type="submit">Create</button>
</form>

<a href="{{ url_for('index') }}" id="back-link">Back</a>
{% endblock %}

{% block extra_scripts %}
{% include "articles/editor.html" %}

<script>
  let hasUnsavedChanges = false;
  let editorInstance = null;

  // Track changes in form inputs
  document.querySelectorAll('#post-form input, #post-form textarea').forEach(function(input) {
    input.addEventListener('input', function() {
      hasUnsavedChanges = true;
    });
  });

  // Track changes in CKEditor when it's ready
  ClassicEditor.create(document.querySelector('#content-editor'), {
    extraPlugins: [UploadAdapterPlugin],
    // Tables and media embeds are not in the sanitizer allowlist (T05).
    removePlugins: ARTICLE_EDITOR_REMOVED_PLUGINS,
    toolbar: { removeItems: ARTICLE_EDITOR_REMOVED_TOOLBAR_ITEMS }
  }).then(function(editor) {
    editorInstance = editor;
    editor.model.document.on('change:data', function() {
      hasUnsavedChanges = true;
    });
  }).catch(function (error) {
    console.error(error);
  });

  // Warn before leaving page
  window.addEventListener('beforeunload', function(e) {
    if (hasUnsavedChanges) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  // Warn when clicking back button
  document.getElementById('back-link').addEventListener('click', function(e) {
    if (hasUnsavedChanges) {
      if (!confirm('You have unsaved changes. Are you sure you want to leave?')) {
        e.preventDefault();
      }
    }
  });

  // Reset flag on form submit
  document.getElementById('post-form').addEventListener('submit', function() {
    hasUnsavedChanges = false;
  });
</script>
{% endblock %}
