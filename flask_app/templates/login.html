{% extends "base.html" %}

{% block title %}Log in - Troniworld{% endblock %}

{% block content %}
<h2>Log in</h2>

<form method="post">
  <label>
    Username
    <input type="text" name="username" required>
  </label>
  <br>
  <label>
    Password
    <input type="password" name="password" required>
  </label>
  <br>
  <button type="submit">Log in</button>
</form>
{% endblock %}
